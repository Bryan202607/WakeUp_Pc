name: Créer la clé de signature

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Générer la clé et l'enregistrer dans les secrets
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Le secret SECRETS_PAT est absent. Crée-le d'abord (voir PLAYSTORE.md)."
            exit 1
          fi
          if gh secret list | grep -q ANDROID_KEYSTORE_BASE64; then
            echo "La clé existe déjà, rien n'est modifié."
            exit 0
          fi
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore upload.jks -storetype PKCS12 \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=WakeUp-Pc, O=WakeUp-Pc, C=CM"
          base64 -w0 upload.jks | gh secret set ANDROID_KEYSTORE_BASE64
          printf %s "$PASS" | gh secret set ANDROID_KEYSTORE_PASSWORD
          echo "Clé créée et enregistrée dans les secrets du dépôt."
