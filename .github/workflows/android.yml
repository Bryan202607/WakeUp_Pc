name: Construire l'appli Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dessiner les icônes
        run: |
          pip install pillow
          python tools/make_assets.py

      - name: Compiler l'interface
        run: |
          npm install
          npm run build

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Numéro de version
        run: |
          VC=${{ github.run_number }}
          sed -i -E "s/versionCode[[:space:]]*=?[[:space:]]*[0-9]+/versionCode = $VC/" android/app/build.gradle
          sed -i -E "s/versionName[[:space:]]*=?[[:space:]]*\"[^\"]*\"/versionName = \"1.0.$VC\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Compiler le bundle Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Signer le bundle
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "Clé de signature absente. Lance d'abord le workflow 'Créer la clé de signature'."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > upload.jks
          cp android/app/build/outputs/bundle/release/app-release.aab WakeUp-Pc.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore upload.jks -storepass "$KS_PASS" -keypass "$KS_PASS" \
            WakeUp-Pc.aab upload
          jarsigner -verify WakeUp-Pc.aab | tail -n 1
          rm upload.jks

      - uses: actions/upload-artifact@v4
        with:
          name: WakeUp-Pc-aab
          path: WakeUp-Pc.aab
          retention-days: 30
